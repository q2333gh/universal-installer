name: Build unsigned release

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/unsigned-release-apk-dfbf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      # No key.properties on this fork → release has no signingConfig → unsigned APK.
      - name: Assemble opensource release (unsigned)
        run: ./gradlew :app:assembleOpensourceRelease

      - name: List APK outputs
        run: find app/build/outputs/apk -type f -name '*.apk' -print -exec ls -la {} \;

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apk
          path: app/build/outputs/apk/opensource/release/*.apk
          if-no-files-found: error
          retention-days: 14
